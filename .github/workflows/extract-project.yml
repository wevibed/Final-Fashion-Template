
name: Extract Fashion Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP file
        run: |
          ZIP_FILE="wevibed-fashion.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            exit 1
          fi

          mkdir -p extracted-project
          unzip -o "$ZIP_FILE" -d extracted-project

          echo "ZIP extraction completed."
          find extracted-project -maxdepth 3 -type f | head -100

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add extracted-project

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract fashion project ZIP"
            git push
          fi
